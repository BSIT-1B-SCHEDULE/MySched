<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Class Schedule</title>
</head>

<body>

<div class="page-background"></div>

<div class="logo-header">
    <img src="LOGO.png" alt="BSIT 1B Logo">
    <h1>BSIT 1B</h1>
    <p class="subtitle">Class Schedule</p>
</div>

<label for="day"></label>

<div class="day-buttons">
    <button class="day-btn" data-day="Monday">Monday</button>
    <button class="day-btn" data-day="Tuesday">Tuesday</button>
    <button class="day-btn" data-day="Wednesday">Wednesday</button>
    <button class="day-btn" data-day="Thursday">Thursday</button>
    <button class="day-btn" data-day="Friday">Friday</button>
    <button class="day-btn" data-day="Saturday">Saturday</button>
</div>

<div id="schedule"></div>

<button id="addSubject">➕ Add Subject</button>

<div id="addForm" style="display: none;">
    <input type="text" id="subjectName" placeholder="Subject name">
    <input type="text" id="subjectTime" placeholder="Class time (e.g. 9:00 AM - 12:00 PM)">
    <button id="saveSubject">Save Subject</button>
</div>

<!-- MAIN SCRIPT -->
<script>
const schedule = document.getElementById("schedule");

const scheduleData = {
    Monday: [
        ["Life and Works of Rizal", "10:00 AM - 12:00 PM"],
        ["Operating System", "2:30 PM - 4:00 PM"],
        ["PC Troubleshooting", "4:00 PM - 5:30 PM"],
        ["Intro to Computing", "5:30 PM - 7:00 PM"]
    ],

    Tuesday: [
        ["Programming 1", "10:30 AM - 12:00 PM"],
        ["Mathematics in Modern World", "1:00 PM - 2:30 PM"],
        ["Arts Appreciation", "5:30 PM - 8:00 PM"]
    ],

    Wednesday: [
        ["Physical Education", "10:00 AM - 12:00 PM"],
        ["Operating System", "2:30 PM - 4:00 PM"],
        ["PC Troubleshooting", "4:00 PM - 5:30 PM"],
        ["Intro to Computing", "5:30 PM - 7:00 PM"]
    ],

    Thursday: [
        ["Programming 1", "10:30 AM - 12:00 PM"],
        ["Mathematics in Modern World", "1:00 PM - 2:30 PM"]
    ],

    Friday: [],

    Saturday: [
        ["CWTS", "9:00 - 12:00 AM"],
        ["ROTC", "9:00 PM - 12:00 PM"]
    ]
};

let selectedDay = "";

function showSchedule(day) {
    if (day === "") {
        schedule.innerHTML = "";
        return;
    }

    const subjects = scheduleData[day] || [];

    if (subjects.length === 0) {
        schedule.innerHTML = `
            <h2>${day}</h2>
            <p>No Classes</p>
        `;
        return;
    }

    let output = `<h2>${day}</h2>`;

    subjects.forEach(function (subject, index) {
        output += `
            <div class="subject-card">
                <div class="subject-name">${index + 1}. ${subject[0]}</div>
                <div class="subject-time">🕐 ${subject[1]}</div>
            </div>
        `;
    });

    schedule.innerHTML = output;
}

document.querySelectorAll(".day-btn").forEach(function (button) {
    button.addEventListener("click", function () {
        selectedDay = button.getAttribute("data-day");

        document.querySelectorAll(".day-btn").forEach(function (btn) {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        showSchedule(selectedDay);
    });
});

document.getElementById("addSubject").addEventListener("click", function () {
    if (selectedDay === "") {
        alert("Please select a day first.");
        return;
    }
    document.getElementById("addForm").style.display = "block";
});

document.getElementById("saveSubject").addEventListener("click", function () {
    const subject = document.getElementById("subjectName").value.trim();
    const time = document.getElementById("subjectTime").value.trim();

    if (subject === "" || time === "") {
        alert("Please enter the subject and class time.");
        return;
    }

    scheduleData[selectedDay].push([subject, time]);

    document.getElementById("subjectName").value = "";
    document.getElementById("subjectTime").value = "";
    document.getElementById("addForm").style.display = "none";

    showSchedule(selectedDay);
});
</script>

<!-- REMINDERS (script.js) -->
<script src="script.js"></script>

</body>
</html>
